# 默认实验配置

n_trials: 100
base_seed: 42
output_dir: "output"

estimators:
  - "diff_in_means"
  - "ols_adjusted"
  - "lasso_adjusted"
  - "cross_fitting_dml"

estimator_kwargs:
  lasso_adjusted:
    alpha: null
    standardize: true
  cross_fitting_dml:
    n_folds: 5
    alpha: null
    standardize: true

param_grid:
  n: [200, 500]
  p: [5, 20, 100]
  ate: [1.0]
  corr_type: ["independent", "exchangeable"]
  rho: [0.5]
  hetero_type: ["linear"]
  hetero_strength: [0.5]
  assignment: ["stratified"]
  n_strata: [4]
  treat_prob: [0.5]
  noise_sd: [1.0]
  sparse: [true]
